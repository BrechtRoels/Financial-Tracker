[project]
name = "finance-tracker-backend"
version = "0.1.0"
description = "Personal finance tracker backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "pydantic-ai>=1.0",
    "sqlparse>=0.5",
    "matplotlib>=3.8",
    "yfinance>=0.2",
    # Optional: enables Turso (libSQL) DATABASE_URL.
    # Imported lazily by SQLAlchemy when the URL starts with `sqlite+libsql://`.
    "sqlalchemy-libsql>=0.1; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
