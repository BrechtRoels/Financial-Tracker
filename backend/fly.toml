# Fly.io config for the Finance Tracker FastAPI backend.
# After `fly launch --no-deploy` (or copying this file), set secrets:
#   fly secrets set DATABASE_URL="sqlite+libsql://<turso-host>?authToken=<JWT>&secure=true"
#   fly secrets set SECRET_KEY="$(openssl rand -hex 32)"
#   fly secrets set GENAI_API_KEY="<pwc-genai-key>"
#   fly secrets set CORS_ORIGINS="https://<your-vercel-domain>.vercel.app"
# Then: fly deploy

app = "financial-tracker"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
